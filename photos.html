<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dceef5">
  <title>相片 · Photos</title>
  <!-- 字体统一走系统栈（声明见 css/src/tokens.css 的 --font-display / --font-body）。
       原 Google Fonts 外链是渲染阻塞资源：实测 4 个页面共发起 115 个字体请求，
       首页 load 因此增加约 6.9s（A/B 实测 7554ms → 679ms），且阻塞全部 defer 脚本执行，故移除。
       回退结果：标题 Quicksand → HarmonyOS Sans / sans-serif；正文 Noto Sans SC → 系统中文。 -->
  <link rel="stylesheet" href="css/dist/shared.css?v=20260934">
  <link rel="stylesheet" href="css/dist/photos.css?v=20260934">
</head>
<body class="works-page">

  <!-- 漂浮光斑背景 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-orb orb-4"></div>
  <div class="bg-grain"></div>

  <!-- 自定义光标 -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- 顶部胶囊导航（与首页一致；高亮由 js/main.js 按 href 自动标记） -->
  <header class="glass-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">真名有寻</a>
      <nav class="nav-links" aria-label="站内导航">
        <a href="index.html">首页</a>
        <a href="works.html">作品集</a>
        <a href="collect.html">芸香集</a>
        <a href="sites.html">站点集</a>
        <a href="photos.html">相片</a>
        <a href="notes.html">笔记本</a>
        <a href="about.html">关于我</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- 相片 -->
  <section id="photos" class="works works-page-section">
    <div class="section-head works-head">
      <div class="works-title-box">
        <span class="section-tag reveal">Photos</span>
        <h2 class="section-title reveal">相片集</h2>
      </div>
    </div>
    <!-- 由 JS 数据渲染的相片网格（数据源：js/photos-data.js） -->
    <div class="works-grid" id="photosGrid"></div>
    <footer class="site-footer">
      <p>© 2026 你的名字 · 用镜头，记录生活的每一个瞬间</p>
    </footer>
  </section>

  <!-- 相片小灯箱（点击卡片预览） -->
  <div class="photo-lightbox" id="photoLightbox" role="dialog" aria-modal="true" aria-label="相片预览" data-lenis-prevent>
    <button class="pl-close" id="plClose" aria-label="关闭">×</button>
    <button class="pl-nav pl-prev" id="plPrev" aria-label="上一张">‹</button>
    <button class="pl-nav pl-next" id="plNext" aria-label="下一张">›</button>
    <figure class="pl-stage">
      <div class="pl-img" id="plImg"></div>
      <figcaption class="pl-caption">
        <h3 id="plTitle"></h3>
        <p id="plDesc"></p>
        <span class="pl-count" id="plCount"></span>
      </figcaption>
    </figure>
  </div>

  <!-- GSAP + Lenis -->
  <script src="js/vendor/gsap.min.js?v=20260934" defer></script>
  <script src="js/vendor/ScrollTrigger.min.js?v=20260934" defer></script>
  <script src="js/vendor/lenis.min.js?v=20260934" defer></script>
  <!-- SDK 适配层：必须在 main.js 与各页面模块之前 -->
  <script src="js/fx.js?v=20260934" defer></script>
  <script src="js/links.js?v=20260934" defer></script>
  <script src="js/photos-data.js?v=20260934" defer></script>
  <!-- 共享工具层（弹窗开关 / 关闭途径） -->
  <script src="js/ui.js?v=20260934" defer></script>
  <script src="js/main.js?v=20260934" defer></script>
</body>
</html>
