<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dceef5">
  <title>芸香集 · Collect</title>
  <!-- 字体统一走系统栈（声明见 css/src/tokens.css 的 --font-display / --font-body）。
       原 Google Fonts 外链是渲染阻塞资源：实测 4 个页面共发起 115 个字体请求，
       首页 load 因此增加约 6.9s（A/B 实测 7554ms → 679ms），且阻塞全部 defer 脚本执行，故移除。
       回退结果：标题 Quicksand → HarmonyOS Sans / sans-serif；正文 Noto Sans SC → 系统中文；
       引文与书名的 Noto Serif SC → serif（本页 collect-quote/collect-book/collect-acad 使用）。 -->
  <link rel="stylesheet" href="css/dist/shared.css?v=20260930">
</head>
<body class="works-page">

  <!-- 漂浮光斑背景 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-orb orb-4"></div>
  <div class="bg-grain"></div>

  <!-- 自定义光标 -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- 顶部胶囊导航（与首页一致；高亮由 js/main.js 按 href 自动标记） -->
  <header class="glass-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">真名有寻</a>
      <nav class="nav-links" aria-label="站内导航">
        <a href="index.html">首页</a>
        <a href="works.html">作品集</a>
        <a href="collect.html">芸香集</a>
        <a href="sites.html">站点集</a>
        <a href="photos.html">相片</a>
        <a href="notes.html">笔记本</a>
        <a href="about.html">关于我</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- 芸香集：收集本 -->
  <section id="collect" class="works collect-page-section">
    <div class="section-head collect-head">
      <div class="collect-head-text">
        <span class="section-tag reveal">Collect</span>
        <h2 class="section-title reveal">芸香集</h2>
        <p class="collect-desc reveal">查到的资料、喜欢的句子、读过的书，都收在这里——一片能翻很久的收藏园。</p>
      </div>
      <div class="collect-actions reveal">
        <button class="collect-btn primary" id="favBtn">♥ 收藏夹</button>
      </div>
    </div>

    <!-- 主分类 + 子标签筛选 + 全文搜索 -->
    <div id="collectFilter">
      <div class="collect-toolbar reveal">
        <div class="collect-tags" id="collectTags"></div>
        <div class="collect-search">
          <span class="collect-search-icon">⌕</span>
          <input type="text" id="collectSearch" placeholder="搜索标题、内容或标签…">
        </div>
      </div>
      <div class="collect-subtags" id="subTagRow"></div>
    </div>

    <!-- 条目网格（JS 渲染） -->
    <div class="works-grid" id="collectGrid"></div>

    <p class="collect-hint reveal" id="collectHint"></p>

    <footer class="site-footer">
      <p>© 2026 你的名字 · 用清新与玻璃，收拢每一处值得留下的痕迹</p>
    </footer>
  </section>

  <!-- 弹窗：收藏夹 -->
  <div class="collect-modal" id="favModal" role="dialog" aria-modal="true" aria-label="收藏夹" data-lenis-prevent>
    <div class="collect-modal-inner">
      <button class="cm-close" data-close="favModal" aria-label="关闭">×</button>
      <h3 class="cm-title">收藏夹</h3>
      <p class="cm-sub" id="favSub"></p>
      <div class="cm-fav-list" id="favList"></div>
    </div>
  </div>

  <!-- 灯箱：条目详情（点击卡片打开） -->
  <div class="collect-modal" id="detailModal" role="dialog" aria-modal="true" aria-label="条目详情" data-lenis-prevent>
    <div class="collect-modal-inner detail">
      <button class="cm-close" data-close="detailModal" aria-label="关闭">×</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- GSAP + Lenis -->
  <script src="js/vendor/gsap.min.js?v=20260930" defer></script>
  <script src="js/vendor/ScrollTrigger.min.js?v=20260930" defer></script>
  <script src="js/vendor/lenis.min.js?v=20260930" defer></script>
  <!-- SDK 适配层：必须在 main.js 与各页面模块之前 -->
  <script src="js/fx.js?v=20260930" defer></script>
  <script src="js/links.js?v=20260930" defer></script>
  <!-- 共享工具层：必须早于 main.js，main.js 内的 UI.* 调用依赖它 -->
  <script src="js/ui.js?v=20260930" defer></script>
  <script src="js/main.js?v=20260930" defer></script>
  <!-- 内容数据：与本页逻辑解耦，补充条目只改 js/collect-data.js -->
  <script src="js/collect-data.js?v=20260930"></script>
  <!-- 芸香集页面逻辑 -->
  <script src="js/collect.js?v=20260930" defer></script>

</body>
</html>
