<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dceef5">
  <title>作品集 · Works</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dist/shared.css?v=20260921">
</head>
<body class="works-page">

  <!-- 漂浮光斑背景 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-orb orb-4"></div>
  <div class="bg-grain"></div>

  <!-- 自定义光标 -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- 左上角迷你导航 -->
  <nav class="mini-nav" aria-label="页面导航">
    <a href="index.html"><span class="mn-dot"></span><span class="mn-label">首页</span></a>
    <a href="works.html"><span class="mn-dot"></span><span class="mn-label">作品集</span></a>
    <a href="collect.html"><span class="mn-dot"></span><span class="mn-label">芸香集</span></a>
    <a href="sites.html"><span class="mn-dot"></span><span class="mn-label">站点集</span></a>
    <a href="photos.html"><span class="mn-dot"></span><span class="mn-label">相片</span></a>
    <a href="notes.html"><span class="mn-dot"></span><span class="mn-label">笔记本</span></a>
    <a href="about.html"><span class="mn-dot"></span><span class="mn-label">关于我</span></a>
  </nav>

  <!-- 作品集 -->
  <section id="works" class="works works-page-section">
    <div class="section-head works-head">
      <div class="works-title-box">
        <span class="section-tag reveal">Works</span>
        <h2 class="section-title reveal">作品集</h2>
        <p class="works-count reveal" id="worksCount"></p>
      </div>
      
    </div>

    <!-- 分类筛选胶囊 -->
    <div class="works-filter reveal" id="worksFilter">
      <button class="filter-chip active" data-filter="all">全部</button>
      <button class="filter-chip" data-filter="web">web开发</button>
      <button class="filter-chip" data-filter="agent">agent</button>
      <button class="filter-chip" data-filter="app">应用</button>
    </div>

    <!-- 由 JS 数据渲染的作品网格（杂志画廊瀑布流） -->
    <div class="works-grid magazine" id="worksGrid"></div>

    <footer class="site-footer">
      <p>© 2026 你的名字 · 用清新与玻璃，讲述每一件作品的故事</p>
    </footer>
  </section>

  <!-- 灯箱弹层（沉浸相册） -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品详情" data-lenis-prevent>
    <button class="lightbox-close" id="lbClose" aria-label="关闭">×</button>
    <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="上一个">‹</button>
    <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="下一个">›</button>
    <div class="lightbox-inner">
      <div class="lightbox-media">
        <div class="lightbox-img" id="lbImg"></div>
      </div>
      <div class="lightbox-info">
        <span class="lightbox-tag" id="lbTag"></span>
        <h3 class="lightbox-title" id="lbTitle"></h3>
        <p class="lightbox-desc" id="lbDesc"></p>
        <div class="lightbox-skills" id="lbSkills"></div>
        <div class="lightbox-meta" id="lbMeta"></div>
      </div>
    </div>
    <div class="lightbox-thumbs" id="lbThumbs"></div>
  </div>

  <!-- GSAP + Lenis -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <!-- SDK 适配层：必须在 main.js 与各页面模块之前 -->
  <script src="js/fx.js?v=20260910" defer></script>
  <script src="js/links.js?v=20260910" defer></script>
  <script src="js/works-data.js?v=20260910" defer></script>
  <!-- 共享工具层（弹窗开关 / 关闭途径） -->
  <script src="js/ui.js?v=20260910" defer></script>
  <script src="js/main.js?v=20260910" defer></script>
</body>
</html>
