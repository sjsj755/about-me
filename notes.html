<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dceef5">
  <title>笔记本 · Notes</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dist/shared.css?v=20260926">
</head>
<body class="works-page">

  <!-- 漂浮光斑背景 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-orb orb-4"></div>
  <div class="bg-grain"></div>

  <!-- 自定义光标 -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- 顶部胶囊导航（与首页一致；高亮由 js/main.js 按 href 自动标记） -->
  <header class="glass-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">真名有寻</a>
      <nav class="nav-links" aria-label="站内导航">
        <a href="index.html">首页</a>
        <a href="works.html">作品集</a>
        <a href="collect.html">芸香集</a>
        <a href="sites.html">站点集</a>
        <a href="photos.html">相片</a>
        <a href="notes.html">笔记本</a>
        <a href="about.html">关于我</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- 笔记本：学习笔记 -->
  <section id="notes" class="works collect-page-section">
    <div class="section-head collect-head">
      <div class="collect-head-text">
        <span class="section-tag reveal">Notes</span>
        <h2 class="section-title reveal">笔记本</h2>
        <p class="collect-desc reveal">学习笔记散落在各处，这里挂着通往它们的一张张便签。</p>
      </div>
      <div class="collect-actions reveal">
        <button class="collect-btn primary" id="addBtn">＋ 挂一张便签</button>
      </div>
    </div>

    <!-- 便签墙（JS 渲染：每 3 张一组挂在同一根绳子上） -->
    <div class="works-grid" id="notesGrid"></div>

    <p class="collect-hint reveal" id="notesHint"></p>

    <footer class="site-footer">
      <p>© 2026 你的名字 · 用清新与玻璃，收拢每一处值得留下的痕迹</p>
    </footer>
  </section>

  <!-- 弹窗：写笔记 -->
  <div class="collect-modal" id="addModal" role="dialog" aria-modal="true" aria-label="写笔记" data-lenis-prevent>
    <div class="collect-modal-inner">
      <button class="cm-close" data-close="addModal" aria-label="关闭">×</button>
      <h3 class="cm-title">写笔记</h3>
      <p class="cm-sub">粘贴文档链接，便签会自动挂上晾绳。</p>
      <form id="addForm">
        <div class="cm-field">
          <span>标题</span>
          <input type="text" id="fTitle" placeholder="这篇笔记是关于什么" required>
        </div>
        <div class="cm-field">
          <span>链接</span>
          <input type="url" id="fLink" placeholder="https://…（选填，留空则只在本地留存）">
        </div>
        <div class="cm-field">
          <!-- maxlength 是摘要字数的唯一来源：js/notes.js 的计数器直接读它，两处不会漂移。
               便签纸是固定尺寸的，摘要超过上限就会被 CSS 截断，所以限制必须挡在输入侧。 -->
          <span>摘要 <em class="note-counter" id="fDescCount" aria-live="polite"></em></span>
          <textarea id="fDesc" maxlength="60" placeholder="一句话记下这条笔记的关键点…（最多 60 字，便签正面会完整显示）" required></textarea>
        </div>
        <div class="cm-actions">
          <button type="button" class="collect-btn" data-close="addModal">取消</button>
          <button type="submit" class="collect-btn primary">保存笔记</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 灯箱：笔记详情（点击卡片打开） -->
  <div class="collect-modal" id="detailModal" role="dialog" aria-modal="true" aria-label="笔记详情" data-lenis-prevent>
    <div class="collect-modal-inner detail">
      <button class="cm-close" data-close="detailModal" aria-label="关闭">×</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- GSAP + Lenis -->
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/vendor/lenis.min.js"></script>
  <!-- 页面逻辑：适配层（fx）→ 公共工具（ui）→ 共享脚本（main）→ 数据（notes-data）→ 页面模块（notes），defer 保证按序执行 -->
  <!-- ui.js 必须早于 main.js：main.js 内的 UI.* 调用依赖它 -->
  <script src="js/fx.js?v=20260926" defer></script>
  <script src="js/links.js?v=20260926" defer></script>
  <script src="js/ui.js?v=20260926" defer></script>
  <script src="js/main.js?v=20260926" defer></script>
  <script src="js/notes-data.js?v=20260926" defer></script>
  <script src="js/notes.js?v=20260926" defer></script>
</body>
</html>
