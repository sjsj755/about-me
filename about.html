<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dceef5">
  <title>关于我 · About</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <!-- 字体统一走系统栈（声明见 css/src/tokens.css 的 --font-display / --font-body）。
       原 Google Fonts 外链是渲染阻塞资源：实测 4 个页面共发起 115 个字体请求，
       首页 load 因此增加约 6.9s（A/B 实测 7554ms → 679ms），且阻塞全部 defer 脚本执行，故移除。
       回退结果：标题 Quicksand → HarmonyOS Sans / sans-serif；正文 Noto Sans SC → 系统中文。 -->
  <link rel="stylesheet" href="css/dist/shared.css?v=20260934">
  <link rel="stylesheet" href="css/dist/about.css?v=20260934">
</head>
<body class="about-page">

  <!-- 漂浮光斑背景 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-orb orb-4"></div>
  <div class="bg-grain"></div>

  <!-- 自定义光标 -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- 顶部胶囊导航（与首页一致；高亮由 js/main.js 按 href 自动标记） -->
  <header class="glass-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">真名有寻</a>
      <nav class="nav-links" aria-label="站内导航">
        <a href="index.html">首页</a>
        <a href="works.html">作品集</a>
        <a href="collect.html">芸香集</a>
        <a href="sites.html">站点集</a>
        <a href="photos.html">相片</a>
        <a href="notes.html">笔记本</a>
        <a href="about.html">关于我</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- 关于我：内容集中在 js/about-data.js，此处仅留容器，由 main.js 渲染 -->
  <section id="about" class="about about-page-section">
    <div class="section-head">
      <span class="section-tag reveal">About</span>
      <h2 class="section-title reveal">关于我</h2>
    </div>

    <div class="about-hero reveal">
      <div class="avatar"></div>
      <div class="about-hero-text">
        <h3>嗨，我是 <span class="accent-inline">你的名字</span></h3>
        <p id="aboutRoles"></p>
      </div>
    </div>

    <div class="about-grid" id="aboutGrid"></div>

    <div class="glass-panel journey reveal" id="aboutJourney"></div>

    <div class="about-cta reveal" id="aboutCta"></div>

    <footer class="site-footer">
      <p>© 2026 你的名字 · <span id="aboutTagline"></span></p>
    </footer>
  </section>

  <!-- 弹窗：联系表单（复用 collect-modal 玻璃拟态骨架，文案由 js/about-data.js 填充） -->
  <div class="collect-modal" id="contactModal" role="dialog" aria-modal="true" aria-label="联系我" data-lenis-prevent>
    <div class="collect-modal-inner">
      <button class="cm-close" data-contact-close aria-label="关闭">×</button>
      <h3 class="cm-title" id="contactTitle">联系我</h3>
      <p class="cm-sub" id="contactSub"></p>
      <form id="contactForm">
        <div class="cm-field">
          <span>称呼</span>
          <input type="text" id="cName" placeholder="怎么称呼你（可选）">
        </div>
        <div class="cm-field">
          <span>回复邮箱（可选）</span>
          <input type="email" id="cEmail" placeholder="name@example.com">
        </div>
        <div class="cm-field">
          <span>想说的话</span>
          <textarea id="cMsg" placeholder="写点什么告诉我吧…" required></textarea>
        </div>
        <div class="cm-actions">
          <button type="button" class="collect-btn" data-contact-close>取消</button>
          <button type="submit" class="collect-btn primary" id="contactSend">发送留言</button>
        </div>
      </form>
    </div>
  </div>

  <!-- GSAP + Lenis -->
  <script src="js/vendor/gsap.min.js?v=20260934" defer></script>
  <script src="js/vendor/ScrollTrigger.min.js?v=20260934" defer></script>
  <script src="js/vendor/lenis.min.js?v=20260934" defer></script>
  <!-- SDK 适配层：必须在 main.js 与各页面模块之前 -->
  <script src="js/fx.js?v=20260934" defer></script>
  <script src="js/links.js?v=20260934" defer></script>
  <script src="js/about-data.js?v=20260934" defer></script>
  <!-- 共享工具层（弹窗开关 / 关闭途径） -->
  <script src="js/ui.js?v=20260934" defer></script>
  <script src="js/main.js?v=20260934" defer></script>
</body>
</html>
