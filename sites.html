﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dceef5">
  <title>站点集 · Sites</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260910">
</head>
<body class="works-page">

  <!-- 漂浮光斑背景 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-orb orb-4"></div>
  <div class="bg-grain"></div>

  <!-- 自定义光标 -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- 左上角迷你导航 -->
  <nav class="mini-nav" aria-label="页面导航">
    <a href="index.html"><span class="mn-dot"></span><span class="mn-label">首页</span></a>
    <a href="works.html"><span class="mn-dot"></span><span class="mn-label">作品集</span></a>
    <a href="collect.html"><span class="mn-dot"></span><span class="mn-label">芸香集</span></a>
    <a href="sites.html"><span class="mn-dot"></span><span class="mn-label">站点集</span></a>
    <a href="photos.html"><span class="mn-dot"></span><span class="mn-label">相片</span></a>
    <a href="notes.html"><span class="mn-dot"></span><span class="mn-label">笔记本</span></a>
    <a href="about.html"><span class="mn-dot"></span><span class="mn-label">关于我</span></a>
  </nav>

  <!-- 站点集：简洁链接墙 -->
  <section id="sites" class="works collect-page-section">
    <div class="section-head collect-head">
      <div class="collect-head-text">
        <span class="section-tag reveal">Sites</span>
        <h2 class="section-title reveal">站点集</h2>
        <p class="collect-desc reveal">查资料时留下的网址都汇在这里——一句话说明，点击直达。</p>
      </div>
    </div>

    <!-- 分类筛选 + 全文搜索 -->
    <div id="siteFilter">
      <div class="collect-toolbar reveal">
        <div class="collect-tags" id="siteTags"></div>
        <div class="collect-search">
          <span class="collect-search-icon">⌕</span>
          <input type="text" id="siteSearch" placeholder="搜索站点名、描述或域名…">
        </div>
      </div>
    </div>

    <!-- 站点网格（JS 渲染） -->
    <div class="sites-grid" id="siteGrid"></div>

    <p class="collect-hint reveal" id="siteHint"></p>

    <footer class="site-footer">
      <p>© 2026 你的名字 · 用清新与玻璃，收拢每一处值得留下的痕迹</p>
    </footer>
  </section>

  <!-- GSAP + Lenis -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <!-- SDK 适配层：必须在 main.js 与各页面模块之前 -->
  <script src="js/fx.js?v=20260921" defer></script>
  <script src="js/links.js?v=20260921" defer></script>
  <script src="js/main.js?v=20260921" defer></script>
  <!-- 站点数据：补充内容请编辑 js/sites-data.js -->
  <script src="js/sites-data.js?v=20260921" defer></script>
  <!-- 共享工具层 + 页面逻辑 -->
  <script src="js/ui.js?v=20260921" defer></script>
  <script src="js/sites.js?v=20260921" defer></script>
</body>
</html>
