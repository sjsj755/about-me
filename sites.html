<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dceef5">
  <title>站点集 · Sites</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <!-- 字体统一走系统栈（声明见 css/src/tokens.css 的 --font-display / --font-body）。
       原 Google Fonts 外链是渲染阻塞资源：实测 4 个页面共发起 115 个字体请求，
       首页 load 因此增加约 6.9s（A/B 实测 7554ms → 679ms），且阻塞全部 defer 脚本执行，故移除。
       回退结果：标题 Quicksand → HarmonyOS Sans / sans-serif；正文 Noto Sans SC → 系统中文；
       引文与书名的 Noto Serif SC → serif（本页 sites 使用）。 -->
  <link rel="stylesheet" href="css/dist/shared.css?v=20260934">
  <link rel="stylesheet" href="css/dist/sites.css?v=20260934">
</head>
<body class="works-page">

  <!-- 漂浮光斑背景 -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-orb orb-4"></div>
  <div class="bg-grain"></div>

  <!-- 自定义光标 -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- 顶部胶囊导航（与首页一致；高亮由 js/main.js 按 href 自动标记） -->
  <header class="glass-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">真名有寻</a>
      <nav class="nav-links" aria-label="站内导航">
        <a href="index.html">首页</a>
        <a href="works.html">作品集</a>
        <a href="collect.html">芸香集</a>
        <a href="sites.html">站点集</a>
        <a href="photos.html">相片</a>
        <a href="notes.html">笔记本</a>
        <a href="about.html">关于我</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- 站点集：简洁链接墙 -->
  <section id="sites" class="works collect-page-section">
    <div class="section-head collect-head">
      <div class="collect-head-text">
        <span class="section-tag reveal">Sites</span>
        <h2 class="section-title reveal">站点集</h2>
        <p class="collect-desc reveal">查资料时留下的网址都汇在这里——一句话说明，点击直达。</p>
      </div>
    </div>

    <!-- 分类筛选 + 全文搜索 -->
    <div id="siteFilter">
      <div class="collect-toolbar reveal">
        <div class="collect-tags" id="siteTags"></div>
        <div class="collect-search">
          <span class="collect-search-icon">⌕</span>
          <input type="text" id="siteSearch" placeholder="搜索站点名、描述或域名…">
        </div>
      </div>
    </div>

    <!-- 站点网格（JS 渲染） -->
    <div class="sites-grid" id="siteGrid"></div>

    <p class="collect-hint reveal" id="siteHint"></p>

    <footer class="site-footer">
      <p>© 2026 你的名字 · 用清新与玻璃，收拢每一处值得留下的痕迹</p>
    </footer>
  </section>

  <!-- GSAP + Lenis -->
  <script src="js/vendor/gsap.min.js?v=20260934" defer></script>
  <script src="js/vendor/ScrollTrigger.min.js?v=20260934" defer></script>
  <script src="js/vendor/lenis.min.js?v=20260934" defer></script>
  <!-- SDK 适配层：必须在 main.js 与各页面模块之前 -->
  <script src="js/fx.js?v=20260934" defer></script>
  <script src="js/links.js?v=20260934" defer></script>
  <!-- 共享工具层：必须早于 main.js，main.js 内的 UI.* 调用依赖它 -->
  <script src="js/ui.js?v=20260934" defer></script>
  <script src="js/main.js?v=20260934" defer></script>
  <!-- 站点数据：补充内容请编辑 js/sites-data.js -->
  <script src="js/sites-data.js?v=20260934" defer></script>
  <script src="js/sites.js?v=20260934" defer></script>
</body>
</html>
